services:
  - type: web
    name: noor
    runtime: node
    # الخطوة 1 من 2: الترقية لخطة مدفوعة (الأقراص الدائمة غير متاحة في الخطة المجانية)
    # الخطوة 2 (بعد نجاح الترقية): إضافة قرص دائم 10GB على /var/data والمتغيّر NOOR_DATA=/var/data
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: AUTHENTICA_API_KEY
        sync: false
